[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oreaclebot"
version = "2.0.0"
description = "News-driven prediction market trading bot - connects Snowflake articles to Manifold Markets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Oreacle Bot Team"}
]
keywords = ["manifold", "trading", "prediction-markets", "news", "commodities", "metals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.25.0",
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "snowflake-connector-python>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
# Legacy Chinese regulatory monitoring (original oreaclebot)
legacy = [
    "googletrans>=4.0.0rc1",
]

[project.scripts]
# New article trader (v2.0)
oreaclebot = "oreaclebot.article_trader.cli:main"
article-trader = "oreaclebot.article_trader.cli:main"
# Legacy commands (still available)
oreaclebot-monitor = "oreaclebot.cli:monitor"
oreaclebot-single = "oreaclebot.cli:single_cycle"
oreaclebot-ladder-check = "oreaclebot.cli:ladder_check"
oreaclebot-sentinel-byd = "oreaclebot.cli:sentinel_byd"
oreaclebot-legacy = "oreaclebot.cli:main"

[project.urls]
Homepage = "https://github.com/brodheadw/oreacle-bot"
Repository = "https://github.com/brodheadw/oreacle-bot"
Issues = "https://github.com/brodheadw/oreacle-bot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["oreaclebot*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "requests.*",
    "yaml.*",
]
ignore_missing_imports = true
